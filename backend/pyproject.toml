[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-api"
version = "0.1.0"
description = "Relay application API foundation"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "fastapi-users[sqlalchemy]>=15,<16", "cryptography>=46,<51", "asyncpg>=0.30,<1", "pymupdf>=1.25,<2", "python-docx>=1.1,<2", "openai>=2,<3", "python-multipart>=0.0.20,<1", "ortools>=9.10,<10", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "aiosqlite>=0.22,<1", "pytest-asyncio>=1,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires PostgreSQL and applied migrations"]
